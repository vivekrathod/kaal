# Kaal with Docker Compose. Run deploy/docker/install.sh instead of using this
# file directly: it writes the .env file these settings come from.
name: kaal

x-logs: &logs
  # Logs are kept small and rotated, so a flood of requests cannot fill the disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-kaal: &kaal
  image: ${KAAL_IMAGE:-kaal:local}
  restart: unless-stopped
  logging: *logs
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # A runaway program reading a file cannot fork without end.
  pids_limit: 512
  tmpfs: [/tmp]

services:
  kaal:
    <<: *kaal
    build:
      context: ../..
    environment:
      KAAL_PUBLIC_URL: ${KAAL_PUBLIC_URL:?Run deploy/docker/install.sh first}
      KAAL_COOKIE_SECURE: ${KAAL_COOKIE_SECURE:-1}
      # Only proxies on this machine (Caddy, Docker's port forwarding, Tailscale) can reach Kaal,
      # so the address they pass on is believed, and limits apply per visitor.
      KAAL_TRUSTED_PROXIES: private
    env_file:
      - path: kaal.env        # optional extra settings, such as receipt reading
        required: false
    volumes:
      - kaal-data:/srv/kaal
      - kaal-key:/etc/kaal
    extra_hosts:
      # Lets receipt reading reach a model served on this machine (Ollama) as host.docker.internal.
      - "host.docker.internal:host-gateway"
    ports:
      # Only this machine can reach Kaal directly; the proxy in front of it provides HTTPS.
      - "${KAAL_LISTEN:-127.0.0.1:8765}:8765"

  backup:
    <<: *kaal
    command: [backup-daily]
    network_mode: none
    healthcheck:
      disable: true
    volumes:
      - kaal-data:/srv/kaal
      - kaal-key:/etc/kaal:ro
    depends_on:
      kaal:
        condition: service_healthy

  # HTTPS for a domain name of your own, with certificates fetched and renewed automatically.
  caddy:
    profiles: [https]
    image: caddy:2
    restart: unless-stopped
    logging: *logs
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      KAAL_DOMAIN: ${KAAL_DOMAIN:-localhost}
    ports:
      - "${KAAL_HTTP_PORT:-80}:80"
      - "${KAAL_HTTPS_PORT:-443}:443"
      - "${KAAL_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [kaal]

volumes:
  kaal-data:
  kaal-key:
  caddy-data:
  caddy-config:
