# Kaal's demo with Docker Compose. Run deploy/demo/run.sh instead of using
# this file directly: it writes the settings file these values come from.
#
# This is the regular setup in deploy/docker/compose.yaml, with the same image
# and the same hardening (read-only, no capabilities, no new privileges,
# reachable directly only from this machine), and these differences:
#   - everything it stores is held in memory, capped in size, and gone when it
#     restarts or is put back, so it never shares or keeps anything on disk;
#   - demo.py starts Kaal, fills it with made-up data and puts that back nightly;
#   - smaller limits on uploads, memory and processes, since strangers can reach it;
#   - none of a regular installation's own settings (deploy/docker/kaal.env) apply;
#   - there are no backups, since nothing in it is worth keeping.
# KAAL_DEMO_STORAGE, KAAL_DEMO_FREE_SPACE_MB, KAAL_DEMO_MAX_UPLOAD_BYTES and
# KAAL_DEMO_MEMORY can be set in the demo's settings file to change those
# limits (see README.md here).
name: kaal-demo

services:
  kaal:
    extends:
      file: ../docker/compose.yaml
      service: kaal
    image: ${KAAL_IMAGE:?Run deploy/demo/run.sh first}
    command: ["python", "/opt/kaal-demo/demo.py", "serve"]
    env_file: !reset []
    environment:
      KAAL_PUBLIC_URL: ${KAAL_PUBLIC_URL:?Run deploy/demo/run.sh first}
      KAAL_COOKIE_SECURE: ${KAAL_COOKIE_SECURE:-1}
      # Receipts are read by Kaal's own rules; nothing is sent to a model.
      KAAL_RECEIPT_AI: "off"
      # Limits for a server strangers can reach: small files only, no new
      # accounts even if sign-up were opened, and few vaults per person.
      KAAL_MAX_UPLOAD_BYTES: ${KAAL_DEMO_MAX_UPLOAD_BYTES:-10485760}
      KAAL_SIGNUPS_PER_HOUR: "0"
      KAAL_VAULTS_PER_PERSON: "3"
      # Kaal stores nothing new once less than this is free. A regular
      # installation keeps 1 GiB back, which is more than the demo has at all;
      # demo.py starts again some way before this is reached.
      KAAL_FREE_SPACE_MB: ${KAAL_DEMO_FREE_SPACE_MB:-32}
      # What Kaal may hold in memory, cut to fit the memory limit below: files
      # on their way to people, and each vault's text for searching.
      KAAL_DOWNLOAD_MEMORY_MB: "128"
      KAAL_SEARCH_MEMORY_MB: "64"
      # A program reading a file writes its pages and text into the same
      # storage. A regular installation lets each file it writes reach 256 MiB,
      # which is all the demo has; a page of a real receipt is far smaller.
      KAAL_FILE_OUTPUT_MB: "32"
      # Everyone looking at the demo shares one account, so its allowance of
      # requests a minute is three times a regular installation's.
      KAAL_RATE_PER_MINUTE: "1800"
      # Everyone who tries the demo signs in as the same person, so what Kaal counts for each
      # person (tokens an hour, files on their way out, proving the password) is not held
      # against that one account: one visitor could otherwise use it up for all of them.
      KAAL_SHARED_ACCOUNTS: "1"
      # The key is made anew at every reset; nobody is told to keep a copy.
      KAAL_THROWAWAY_KEY: "1"
      KAAL_DEMO_PASSWORD: ${KAAL_DEMO_PASSWORD:?Run deploy/demo/run.sh first}
      KAAL_DEMO_ADMIN_PASSWORD: ${KAAL_DEMO_ADMIN_PASSWORD:?Run deploy/demo/run.sh first}
      KAAL_DEMO_RESET_AT: ${KAAL_DEMO_RESET_AT:-03:00}
      # Only so that a changed demo.py makes this container again (see run.sh).
      KAAL_DEMO_CODE: ${KAAL_DEMO_CODE:-}
    # In place of the regular data and key volumes: only the demo's own script.
    volumes: !override
      - ./demo.py:/opt/kaal-demo/demo.py:ro
    # The whole demo, key included, lives here. The size cap is what keeps
    # strangers from filling the machine; the nightly reset empties it.
    tmpfs:
      - /srv/kaal:size=${KAAL_DEMO_STORAGE:-256m},uid=999,gid=999,mode=0700
      - /etc/kaal:size=1m,uid=999,gid=999,mode=0700
    # What is held in memory above counts here too. Reading a large photo by
    # OCR is what needs the rest; if it ever runs out, the demo starts again
    # with the made-up data instead of taking the machine down with it.
    mem_limit: ${KAAL_DEMO_MEMORY:-1g}
    pids_limit: 256
    # Healthy only once the made-up data is in, so run.sh knows when to say so.
    # Putting it back takes under a minute, which is not long enough to count
    # as unhealthy; two minutes without it is.
    healthcheck:
      test: ["CMD", "python", "/opt/kaal-demo/demo.py", "health"]
      interval: 10s
      timeout: 5s
      start_period: 3m
      retries: 12

  # HTTPS for the demo's own domain, exactly as for a regular installation.
  caddy:
    extends:
      file: ../docker/compose.yaml
      service: caddy

volumes:
  caddy-data:
  caddy-config:
