<!doctype html>
<!-- The Chrome Web Store's small promo tile, 440 x 280. make-screenshots.sh draws it with Chrome. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kaal promo tile</title>
  <style>
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
    body { background: #1f5f55; color: #fff; font: 16px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           display: flex; align-items: center; gap: 26px; padding: 0 36px; box-sizing: border-box; }
    .icon { width: 104px; height: 104px; flex: none; border-radius: 24px; box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.35); }
    h1 { margin: 0 0 8px; font-size: 46px; font-weight: 700; letter-spacing: -0.5px; }
    p { margin: 0; font-size: 19px; color: #dcefe9; }
  </style>
</head>
<body>
  <img class="icon" src="/icon.svg" alt="">
  <div>
    <h1>Kaal</h1>
    <p>Save pages, files and receipts to your own private notes</p>
  </div>
</body>
</html>
