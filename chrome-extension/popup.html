<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Kaal</title>
  <link rel="stylesheet" href="web/app.css">
  <link rel="stylesheet" href="extension.css">
</head>
<body class="popup">
  <div class="popup-head">
    <h1>Kaal</h1>
    <div class="popup-links">
      <a id="open-notes" class="button small" target="_blank" rel="noopener" hidden>Your notes</a>
      <button id="settings" type="button" class="button small">Settings</button>
    </div>
  </div>
  <div id="update" hidden></div>
  <div id="where" class="where" hidden></div>
  <button id="primary" type="button" class="button primary" hidden></button>
  <button id="secondary" type="button" class="link" hidden></button>
  <div id="status" role="status" aria-live="polite"></div>
  <a id="waiting" class="waiting" target="_blank" rel="noopener" hidden></a>
  <script type="module" src="popup.js"></script>
</body>
</html>
